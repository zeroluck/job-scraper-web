# .github/workflows/migration_drift.yml
name: migration-drift

on:
  push:
    branches: [master]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migration_drift.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migration_drift.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout job-scraper-web
        uses: actions/checkout@v4
        with:
          path: job-scraper-web

      # Public repo: no token needed. The drift check itself lives in the
      # authoritative job-scraper repo; this mirror only ensures web-side
      # migration changes are validated on every web push.
      - name: Checkout job-scraper
        uses: actions/checkout@v4
        with:
          repository: zeroluck/job-scraper
          ref: main
          path: job-scraper

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run migration drift check
        run: python job-scraper/scripts/check_migration_drift.py --root job-scraper --web-root job-scraper-web
